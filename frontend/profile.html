<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Leave Management</title>
    <link rel="stylesheet" href="employee.css">
</head>
<body>
    <div class="dashboard-layout">
        <header class="topbar">
            <h2 class="app-title">Leave Management</h2>

            <div class="profile-dropdown">
                <button type="button" id="profileMenuButton" class="profile-btn">
                    <span id="headerEmployeeName">Employee</span>
                    <svg class="dropdown-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
                    </svg>
                </button>

                <div id="profileMenu" class="dropdown-menu hidden">
                    <a href="employee.html" class="dropdown-item">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
                        </svg>
                        Dashboard
                    </a>
                    <a href="leave-history.html" class="dropdown-item">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 00-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"/>
                        </svg>
                        Leave History
                    </a>
                    <button type="button" id="dropdownLogoutButton" class="dropdown-item">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z"/>
                        </svg>
                        Log Out
                    </button>
                </div>
            </div>
        </header>

        <aside class="sidebar">
            <nav>
                <a href="employee.html" class="nav-link">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
                    </svg>
                    Dashboard
                </a>

                <a href="leave-history.html" class="nav-link">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 00-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"/>
                    </svg>
                    Leave History
                </a>

                <a href="apply-leave.html" class="nav-link">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z"/>
                    </svg>
                    Apply Leave
                </a>

                <a href="profile.html" class="nav-link active">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/>
                    </svg>
                    My Profile
                </a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <section class="welcome-section">
                <h1>My Profile</h1>
                <p>View and manage your account information</p>
            </section>

            <div class="profile-grid">
                <section class="content-card profile-card">
                    <div class="profile-avatar">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/>
                        </svg>
                    </div>
                    <h2 id="profileUsername">Loading...</h2>
                    <span class="profile-role-badge" id="profileRoleBadge">Loading...</span>

                    <div class="profile-meta">
                        <div class="meta-item">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z"/>
                            </svg>
                            <span id="profileId">Loading...</span>
                        </div>
                    </div>

                    <p id="profileMessage" role="status" aria-live="polite" class="profile-message"></p>
                </section>

                <section class="content-card password-card">
                    <div class="card-icon">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/>
                        </svg>
                    </div>
                    <h2>Change Password</h2>
                    <p class="card-description">Update your password to keep your account secure</p>

                    <form id="changePasswordForm" class="password-form">
                        <div class="form-group">
                            <label for="currentPassword">
                                <svg viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/>
                                </svg>
                                Current Password
                            </label>
                            <input type="password" id="currentPassword" required minlength="12" placeholder="Enter your current password">
                        </div>

                        <div class="form-group">
                            <label for="newPassword">
                                <svg viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                                </svg>
                                New Password
                            </label>
                            <input type="password" id="newPassword" required minlength="12" maxlength="72" placeholder="Enter new password (12-72 characters)">
                            <small class="form-hint">Must be 12-72 characters long</small>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">
                                <svg viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                                </svg>
                                Confirm New Password
                            </label>
                            <input type="password" id="confirmPassword" required minlength="12" maxlength="72" placeholder="Confirm your new password">
                        </div>

                        <div class="form-actions">
                            <button type="submit" id="changePasswordButton" class="primary-button">
                                <svg viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                                </svg>
                                Update Password
                            </button>
                        </div>

                        <p id="passwordMessage" role="status" class="password-message"></p>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <script src="profile.js"></script>
</body>
</html>
